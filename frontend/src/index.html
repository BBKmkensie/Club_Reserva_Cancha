<!doctype html>
<!-- Shell HTML de la SPA Angular: carga app-root y aplica tema oscuro desde localStorage. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reservas de Cancha - Sistema de Gestión</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/images/logo-nauta.png">
  <script>
    (function () {
      if (localStorage.getItem('app-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
